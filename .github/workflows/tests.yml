name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -r backend/requirements.txt || true

      - name: Run pytest
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          LOCAL_DEV: "true"
          S3_BUCKET: "test-bucket"
          DYNAMODB_TABLE: "test-table"
          BEDROCK_MODEL_ID: "anthropic.claude-3-sonnet-20240229-v1:0"
          COGNITO_USER_POOL_ID: "us-east-1_test"
          COGNITO_APP_CLIENT_ID: "test-client"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:coverage/backend \
            --junitxml=coverage/pytest-results.xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: tests/coverage/

  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: tests/frontend
        run: npm install

      - name: Run Jest
        working-directory: tests/frontend
        run: npx jest --config jest.config.js --ci --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: tests/coverage/frontend/

  infrastructure-tests:
    name: Infrastructure Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pyyaml pydantic pydantic-settings fastapi mangum boto3

      - name: Run infrastructure tests
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          LOCAL_DEV: "true"
          S3_BUCKET: "test-bucket"
          DYNAMODB_TABLE: "test-table"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: pytest integration/test_infrastructure.py -v
