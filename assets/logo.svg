<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a5f3fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67e8f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" />

  <!-- Subtle inner shadow -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Microphone body -->
  <rect x="216" y="120" width="80" height="140" rx="40" ry="40" fill="url(#micGrad)" />

  <!-- Microphone grille lines -->
  <line x1="232" y1="155" x2="280" y2="155" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="232" y1="172" x2="280" y2="172" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="232" y1="189" x2="280" y2="189" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" />
  <line x1="232" y1="206" x2="280" y2="206" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round" />

  <!-- Microphone arc -->
  <path d="M 190 230 Q 190 300 256 300 Q 322 300 322 230" fill="none" stroke="url(#micGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Microphone stand -->
  <line x1="256" y1="300" x2="256" y2="345" stroke="url(#micGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="220" y1="345" x2="292" y2="345" stroke="url(#micGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Sound waves left -->
  <path d="M 160 170 Q 140 200 160 230" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 135 150 Q 105 200 135 250" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M 110 130 Q 70 200 110 270" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  <!-- Sound waves right -->
  <path d="M 352 170 Q 372 200 352 230" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 377 150 Q 407 200 377 250" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M 402 130 Q 442 200 402 270" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  <!-- AI sparkle top-right -->
  <g transform="translate(390, 100)">
    <path d="M 0 -24 L 5 -5 L 24 0 L 5 5 L 0 24 L -5 5 L -24 0 L -5 -5 Z" fill="url(#sparkGrad)" />
  </g>

  <!-- AI sparkle small -->
  <g transform="translate(420, 145)">
    <path d="M 0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z" fill="url(#sparkGrad)" opacity="0.7" />
  </g>

  <!-- Feedback meter bar background -->
  <rect x="130" y="380" width="252" height="24" rx="12" ry="12" fill="rgba(0,0,0,0.2)" />

  <!-- Feedback meter bar fill -->
  <rect x="130" y="380" width="210" height="24" rx="12" ry="12" fill="url(#waveGrad)" />

  <!-- Score text -->
  <text x="400" y="399" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="start">92</text>

  <!-- Label -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="3">PRESENTER FEEDBACK</text>
</svg>
