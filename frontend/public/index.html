<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenter Feedback</title>
    <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body>
    <header>
        <h1>Presenter Feedback</h1>
        <nav id="auth-nav"></nav>
    </header>

    <main>
        <section id="login-section" class="section hidden">
            <!-- Login/signup form rendered by auth.js -->
        </section>

        <section id="recorder-section" class="section">
            <h2>Record Your Presentation</h2>
            <div id="recorder-controls">
                <button id="btn-record" class="btn btn-primary">Record</button>
                <button id="btn-stop" class="btn btn-danger" disabled>Stop</button>
            </div>
            <div id="recording-status"></div>
            <audio id="audio-preview" controls class="hidden"></audio>
            <button id="btn-analyze" class="btn btn-success hidden">Analyze Recording</button>
        </section>

        <section id="results-section" class="section hidden">
            <h2>Analysis Results</h2>
            <div id="results-container"></div>
        </section>

        <section id="history-section" class="section">
            <h2>Past Analyses</h2>
            <div id="history-container"></div>
        </section>
    </main>

    <script type="module" src="../src/app.js"></script>
</body>
</html>
